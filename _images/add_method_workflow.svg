<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="470"
  viewBox="0 0 1200 470"
  role="img"
  aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Workflow for adding a processing method to HTTomo</title>
  <desc id="svgDesc">Four steps show a developer implementing and testing a method in a backend library, confirming that its interface fits an HTTomo wrapper, registering its execution metadata and YAML template in httomo-backends, and validating and running a small HTTomo pipeline. If no existing wrapper fits, the developer extends HTTomo and tests the wrapper before registering the method.</desc>

  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .flow-heading { fill: #102a43; font: 700 27px Arial, sans-serif; text-anchor: middle; }
      .repo { fill: #334e68; font: 700 16px Arial, sans-serif; text-anchor: middle; }
      .card-title { fill: #102a43; font: 700 20px Arial, sans-serif; text-anchor: middle; }
      .text { fill: #486581; font: 15px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #52606d; font: 14px Arial, sans-serif; text-anchor: middle; }
      .number { fill: #ffffff; font: 700 19px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .step-one { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; }
      .step-two { fill: #e0e7ff; stroke: #4338ca; stroke-width: 2; }
      .step-three { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; }
      .step-four { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .num-one { fill: #7e22ce; }
      .num-two { fill: #4338ca; }
      .num-three { fill: #c2410c; }
      .num-four { fill: #15803d; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 4; }
      .branch-label { fill: #475569; font: 700 14px Arial, sans-serif; text-anchor: middle; }
      .yes { fill: #15803d; font: 700 13px Arial, sans-serif; text-anchor: middle; }
      .no { fill: #b45309; font: 700 13px Arial, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="470" />
  <text class="flow-heading" x="600" y="42">From processing function to HTTomo pipeline method</text>

  <!-- Step 1: implementation belongs to the scientific backend. -->
  <rect class="step-one" x="35" y="90" width="250" height="205" rx="16" />
  <circle class="num-one" cx="70" cy="90" r="24" />
  <text class="number" x="70" y="91">1</text>
  <text class="repo" x="160" y="126">BACKEND LIBRARY</text>
  <text class="card-title" x="160" y="163">Implement the method</text>
  <text class="text" x="160" y="198">Write the processing function</text>
  <text class="text" x="160" y="224">Expose it from its module</text>
  <text class="text" x="160" y="250">Add focused unit tests</text>

  <path class="arrow" d="M285 192 H325" />

  <!-- Step 2: choose or extend the wrapper contract. -->
  <rect class="step-two" x="325" y="90" width="250" height="205" rx="16" />
  <circle class="num-two" cx="360" cy="90" r="24" />
  <text class="number" x="360" y="91">2</text>
  <text class="repo" x="450" y="126">HTTOMO INTERFACE</text>
  <text class="card-title" x="450" y="163">Check the wrapper</text>
  <text class="text" x="450" y="198">Does an existing wrapper</text>
  <text class="text" x="450" y="222">support the function?</text>
  <text class="yes" x="554" y="277">YES</text>

  <path class="arrow" d="M575 192 H615" />

  <!-- Step 3: runtime and user-facing descriptions live in httomo-backends. -->
  <rect class="step-three" x="615" y="90" width="250" height="205" rx="16" />
  <circle class="num-three" cx="650" cy="90" r="24" />
  <text class="number" x="650" y="91">3</text>
  <text class="repo" x="740" y="126">HTTOMO-BACKENDS</text>
  <text class="card-title" x="740" y="163">Register the method</text>
  <text class="text" x="740" y="198">Add execution metadata</text>
  <text class="text" x="740" y="224">Add memory/shape helpers</text>
  <text class="text" x="740" y="250">Generate the YAML template</text>

  <path class="arrow" d="M865 192 H905" />

  <!-- Step 4: final validation happens through the user-facing HTTomo path. -->
  <rect class="step-four" x="905" y="90" width="250" height="205" rx="16" />
  <circle class="num-four" cx="940" cy="90" r="24" />
  <text class="number" x="940" y="91">4</text>
  <text class="repo" x="1030" y="126">HTTOMO</text>
  <text class="card-title" x="1030" y="163">Verify the integration</text>
  <text class="text" x="1030" y="198">Validate a small pipeline</text>
  <text class="text" x="1030" y="224">Run representative data</text>
  <text class="text" x="1030" y="250">Submit linked changes</text>

  <!-- Exceptional path: only extend HTTomo if no wrapper fits. -->
  <path class="arrow" d="M450 295 V327" />
  <text class="no" x="473" y="316">NO</text>
  <rect class="branch" x="325" y="327" width="250" height="90" rx="12" />
  <text class="branch-label" x="450" y="355">Extend HTTomo's wrapper layer</text>
  <text class="small" x="450" y="380">Add wrapper tests, then continue</text>
  <path class="arrow" d="M575 372 H590 V285 H615" />
</svg>
