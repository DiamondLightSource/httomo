  <rect
     class="side-value"
     x="80"
     y="195"
     width="420"
     height="68"
     rx="8"
     id="rect5" />
  <text
     class="label"
     x="105"
     y="221"
     id="text6">Side output</text>
  <text
     class="mono"
     x="105"
     y="247"
     id="text7">cor → centre_of_rotation</text>
  <rect
     class="method"
     x="760"
     y="55"
     width="500"
     height="235"
     rx="14"
     id="rect7" />
  <text
     class="heading"
     x="1010"
     y="95"
     id="text8">Reconstruct</text>
  <rect
     class="field"
     x="800"
     y="120"
     width="420"
