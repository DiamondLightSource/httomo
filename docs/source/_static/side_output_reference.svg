  <title
     id="title">Passing a side output between HTTomo methods</title>
  <desc
     id="desc">Data and angles flow directly from a centre-finding method to a reconstruction method. A separate named centre-of-rotation value is referenced by the reconstruction method's center parameter.</desc>
  <defs
     id="defs2">
    <marker
       id="arrow"
       markerWidth="10"
       markerHeight="10"
       refX="9"
       refY="5"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L10,5 L0,10 Z"
         fill="#52606d"
         id="path1" />
    </marker>
    <marker
       id="side-arrow"
       markerWidth="10"
       markerHeight="10"
       refX="9"
       refY="5"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L10,5 L0,10 Z"
         fill="#b45309"
         id="path2" />
    </marker>
    <style
       id="style2">
      .bg { fill: #ffffff; }
      .method { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .field { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.5; }
      .side-value { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; }
      .heading { fill: #102a43; font: 700 24px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #243b53; font: 700 18px Arial, sans-serif; }
      .text { fill: #52606d; font: 16px Arial, sans-serif; }
      .mono { fill: #243b53; font: 15px &quot;DejaVu Sans Mono&quot;, monospace; }
      .line-label { fill: #52606d; font: 16px Arial, sans-serif; text-anchor: middle; }
      .side-label { fill: #9a3412; font: 16px Arial, sans-serif; text-anchor: middle; }
      .data-arrow { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .side-path { fill: none; stroke: #b45309; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#side-arrow); }
    </style>
  </defs>
  <rect
     class="method"
     x="40"
     y="55"
     width="500"
     height="235"
     rx="14"
     id="rect3" />
  <text
     class="heading"
     x="290"
     y="95"
     id="text3">Find centre of rotation</text>
  <rect
