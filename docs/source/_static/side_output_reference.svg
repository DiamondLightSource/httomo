     rx="8"
     id="rect8" />
  <text
     class="label"
     x="825"
     y="145"
     id="text9">Main input</text>
  <text
     class="text"
     x="1010"
     y="146"
     id="text10">data, angles</text>
  <rect
     class="side-value"
     x="800"
     y="195"
     width="420"
     height="68"
     rx="8"
     id="rect10" />
  <text
     class="label"
     x="825"
     y="221"
     id="text11">Parameter</text>
  <text
     class="mono"
     x="825"
     y="239"
     id="text12">center: ${{ centering.side_outputs.</text>
  <text
     class="mono"
     x="825"
     y="258"
     id="text13">centre_of_rotation }}</text>
  <path
