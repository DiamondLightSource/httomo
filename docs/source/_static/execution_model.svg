<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1000"
  viewBox="0 0 1200 1000"
  role="img"
  aria-labelledby="title desc">
  <title id="title">HTTomo pipeline execution model</title>
  <desc id="desc">Four-stage overview showing a YAML process list becoming an executable pipeline, the pipeline being divided into sections, data being distributed into MPI rank chunks within each section, chunks being processed block by block through the section methods, and processing moving to the next section or writing results.</desc>

  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d" />
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .section-frame { fill: #fffaf5; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 8 5; }
      .stage { fill: #334e68; }
      .stage-num { fill: #ffffff; font: 700 21px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .heading { fill: #102a43; font: 700 24px Arial, sans-serif; }
      .subheading { fill: #9a3412; font: 700 18px Arial, sans-serif; }
      .label { fill: #243b53; font: 700 17px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .text { fill: #52606d; font: 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #52606d; font: 14px Arial, sans-serif; text-anchor: middle; }
      .step-label { fill: #243b53; font: 700 15px Arial, sans-serif; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-light { fill: none; stroke: #829ab1; stroke-width: 2.5; marker-end: url(#arrow); }
      .yaml { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; }
      .pipeline { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .section { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; }
      .chunk { fill: #bfdbfe; stroke: #2563eb; stroke-width: 1.5; }
      .block { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
      .method { fill: #e0e7ff; stroke: #4338ca; stroke-width: 1.5; }
      .boundary { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .output { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="1000" />

  <!-- Stage 1: construct the executable pipeline. -->
  <circle class="stage" cx="55" cy="65" r="26" />
  <text class="stage-num" x="55" y="66">1</text>
  <rect class="panel" x="100" y="25" width="1050" height="140" rx="14" />
  <text class="heading" x="130" y="62">Create the pipeline</text>
  <rect class="yaml" x="160" y="88" width="230" height="52" rx="10" />
  <text class="label" x="275" y="114">YAML process list</text>
  <path class="arrow" d="M390 114 H505" />
  <rect class="pipeline" x="505" y="88" width="230" height="52" rx="10" />
  <text class="label" x="620" y="106">Validate</text>
  <text class="small" x="620" y="130">methods and parameters</text>
  <path class="arrow" d="M735 114 H850" />
  <rect class="pipeline" x="850" y="88" width="230" height="52" rx="10" />
  <text class="label" x="965" y="114">Executable pipeline</text>
  <path class="arrow" d="M625 165 V195" />

  <!-- Stage 2: sections are the top-level units of execution. -->
  <circle class="stage" cx="55" cy="235" r="26" />
  <text class="stage-num" x="55" y="236">2</text>
  <rect class="panel" x="100" y="195" width="1050" height="175" rx="14" />
  <text class="heading" x="130" y="232">Divide the pipeline into sections</text>
  <text class="small" x="625" y="256">Group compatible methods that use the same data pattern</text>
  <rect class="pipeline" x="145" y="278" width="190" height="58" rx="9" />
  <text class="label" x="240" y="307">Executable pipeline</text>
  <path class="arrow" d="M335 307 H405" />
  <rect class="section" x="405" y="268" width="245" height="78" rx="10" />
  <text class="label" x="527" y="292">Section 1</text>
  <text class="small" x="527" y="320">methods A–C • projections</text>
  <path class="arrow" d="M650 307 H720" />
  <rect class="section" x="720" y="268" width="245" height="78" rx="10" />
  <text class="label" x="842" y="292">Section 2</text>
  <text class="small" x="842" y="320">methods D–E • sinograms</text>
  <text class="label" x="1015" y="307">…</text>
  <path class="arrow" d="M625 370 V400" />

  <!-- Stage 3: distribution and blocks live inside a section. -->
  <circle class="stage" cx="55" cy="440" r="26" />
  <text class="stage-num" x="55" y="441">3</text>
  <rect class="panel" x="100" y="400" width="1050" height="385" rx="14" />
  <text class="heading" x="130" y="438">Execute one section</text>
  <rect class="section-frame" x="130" y="458" width="990" height="315" rx="12" />
  <text class="subheading" x="155" y="487">Inside the current section</text>

  <text class="step-label" x="160" y="520">1. Distribute the section data into MPI rank chunks</text>
  <rect class="pipeline" x="155" y="535" width="165" height="48" rx="8" />
  <text class="label" x="237" y="559">Section input</text>
  <path class="arrow-light" d="M320 559 H370" />
  <rect class="chunk" x="370" y="530" width="155" height="58" rx="8" />
  <text class="label" x="447" y="550">MPI rank 0</text>
  <text class="small" x="447" y="575">chunk 0</text>
  <rect class="chunk" x="555" y="530" width="155" height="58" rx="8" />
  <text class="label" x="632" y="550">MPI rank 1</text>
  <text class="small" x="632" y="575">chunk 1</text>
  <text class="label" x="752" y="559">…</text>
  <rect class="chunk" x="790" y="530" width="155" height="58" rx="8" />
  <text class="label" x="867" y="550">MPI rank N−1</text>
  <text class="small" x="867" y="575">chunk N−1</text>

  <path class="arrow-light" d="M447 588 V613" />
  <text class="step-label" x="160" y="622">2. Split each rank's chunk into memory-sized blocks</text>
  <rect class="chunk" x="225" y="638" width="135" height="46" rx="8" />
  <text class="label" x="292" y="661">chunk 0</text>
  <path class="arrow-light" d="M360 661 H405" />
  <rect class="block" x="405" y="638" width="115" height="46" rx="8" />
  <text class="label" x="462" y="661">block 1</text>
  <rect class="block" x="535" y="638" width="115" height="46" rx="8" />
  <text class="label" x="592" y="661">block 2</text>
  <rect class="block" x="665" y="638" width="115" height="46" rx="8" />
  <text class="label" x="722" y="661">block 3</text>
  <text class="label" x="820" y="661">…</text>

  <text class="step-label" x="160" y="712">3. Pass one block through every method before starting the next block</text>
  <rect class="block" x="245" y="720" width="115" height="42" rx="8" />
  <text class="label" x="302" y="741">one block</text>
  <path class="arrow-light" d="M360 741 H415" />
  <rect class="method" x="415" y="720" width="130" height="42" rx="8" />
  <text class="label" x="480" y="741">method A</text>
  <path class="arrow-light" d="M545 741 H580" />
  <rect class="method" x="580" y="720" width="130" height="42" rx="8" />
  <text class="label" x="645" y="741">method B</text>
  <path class="arrow-light" d="M710 741 H745" />
  <rect class="method" x="745" y="720" width="130" height="42" rx="8" />
  <text class="label" x="810" y="741">method C</text>
  <text class="small" x="960" y="737">then the</text>
  <text class="small" x="960" y="755">next block</text>
  <path class="arrow" d="M625 785 V815" />

  <!-- Stage 4: prepare the next section or finish. -->
  <circle class="stage" cx="55" cy="855" r="26" />
  <text class="stage-num" x="55" y="856">4</text>
  <rect class="panel" x="100" y="815" width="1050" height="165" rx="14" />
  <text class="heading" x="130" y="852">Move to the next section or finish</text>
  <rect class="section" x="150" y="880" width="195" height="50" rx="9" />
  <text class="label" x="247" y="905">Section complete</text>
  <path class="arrow" d="M345 905 H420" />
  <rect class="boundary" x="420" y="870" width="320" height="70" rx="9" />
  <text class="label" x="580" y="892">Prepare section boundary</text>
  <text class="small" x="580" y="920">synchronise • re-slice • redistribute</text>
  <path class="arrow" d="M740 905 H775 V885 H815" />
  <path class="arrow" d="M775 905 V939 H815" />
  <rect class="section" x="815" y="864" width="175" height="42" rx="8" />
  <text class="label" x="902" y="885">Next section</text>
  <rect class="output" x="815" y="918" width="175" height="42" rx="8" />
  <text class="label" x="902" y="939">Results</text>
</svg>
